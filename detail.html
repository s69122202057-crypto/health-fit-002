<div><h2 style="margin-top:0">${c.n}</h2><div class="price" style="font-size:24px">${f(c.p)} <span class="mu">(เข้าถึงได้ตลอดชีพ)</span></div><div class="card" style="margin:12px 0;font-size:14px">• <b>ผู้สอน:</b> ${c.by}<br>• <b>ระยะเวลา:</b> 30 วัน (วันละ ${c.m})<br>• <b>ระดับ:</b> ${c.lv} · <b>อุปกรณ์:</b> ${c.eq}<br>• <b>แคลอรี่ที่เผาผลาญ:</b> ${c.kc=='-'?'-':'~'+c.kc+' kcal/วัน'}<br>• ${c.d}</div><div class="row"><button class="btn" style="flex:4" onclick="enroll(${c.id})">${I('cart',18)} สมัครคอร์สนี้เลย</button><button class="btn o" onclick="fav(${c.id})">${I('heart',18)}</button></div></div></div>
<h2 id="prev">เนื้อหาคอร์ส</h2><div class="tw card"><table><tr><th>ตอน</th><th>หัวข้อ</th><th>ความยาว</th><th>สถานะ</th></tr><tr><td>EP.1</td><td>แนะนำคอร์สและการวอร์มอัพ</td><td>12 นาที</td><td>ดูตัวอย่างฟรี</td></tr><tr><td>EP.2</td><td>พื้นฐานท่าออกกำลังกายและท่าที่ถูกต้อง</td><td>20 นาที</td><td>หลังสมัคร</td></tr><tr><td>EP.3</td><td>โปรแกรมสัปดาห์ที่ 1</td><td>30 นาที</td><td>หลังสมัคร</td></tr><tr><td>EP.4</td><td>การคูลดาวน์และการฟื้นฟูร่างกาย</td><td>10 นาที</td><td>หลังสมัคร</td></tr></table></div>
